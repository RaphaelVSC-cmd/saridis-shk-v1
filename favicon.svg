<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#0A0E13" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F58A55" />
      <stop offset="100%" stop-color="#E26D35" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonales Shield / Basis -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#bgGrad)" stroke="#E26D35" stroke-width="2.2" stroke-linejoin="round" />
  
  <!-- Innere Struktur-Linien (Präzisions-Rohrnetz-Referenz) -->
  <path d="M32 4 L32 24 M6 46 L24 36 M58 46 L40 36" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Duales Symbol: Links Hydro-Tropfen (Sanitär), Rechts Thermal-Flamme (Heizung) in harmonischer Umarmung -->
  <!-- Hydro-Welle / Tropfenhälfte (Cyan) -->
  <path d="M32,16 C32,16 20,28 20,38 C20,44.6 25.4,50 32,50 C32,50 25,43 28,34 C30,28 32,22 32,16 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
  
  <!-- Thermal-Flamme (Kupfer-Gold) -->
  <path d="M32,14 C32,14 44,25 44,36 C44,43.2 38.6,49 32,49 C35,45 37,39 35,33 C33,27 32,20 32,14 Z" fill="url(#copperGrad)" filter="url(#glow)" />

  <!-- Zentraler Meister-Punkt / Kern (Edelstahl-Glanz) -->
  <circle cx="32" cy="38" r="3" fill="#FFFFFF" opacity="0.95" />
</svg>
